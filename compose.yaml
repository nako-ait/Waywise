name: lushu
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DATA_DIR: /app/data
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY:-}
    environment:
      AMAP_SECURITY_CODE: ${AMAP_SECURITY_CODE:-}
      NGINX_ENVSUBST_FILTER: "^AMAP_SECURITY_CODE"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  gateway:
    image: public.ecr.aws/docker/library/caddy:2.11.7-alpine
    profiles: [public]
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  backend-data:
  caddy-data:
  caddy-config:
